<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Proto Transparency Test</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   PROTO M — BACKGROUND TRANSPARENCY TEST HARNESS
   Cycles the page background through the realistic ways a device player
   makes web content see-through. Only the BACKGROUND changes between
   options; the floating foreground (logo + shapes) stays identical so
   you can judge whether the empty area around it drops out on the device.
   Report which OPTION number goes transparent.
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;color:#fff;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}

/* The device frame. #bg is the layer we recolor per option. */
.frame{position:relative;aspect-ratio:9/16;height:min(100vh,calc(100vw*16/9));width:auto;overflow:hidden;}
#bg{position:absolute;inset:0;z-index:0;}   /* background under test */

/* ---- FOREGROUND: identical across every option ---- */
.fg{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:8cqw;pointer-events:none;}
.fg .bj-mark{width:34cqw;height:auto;aspect-ratio:58/51;filter:drop-shadow(0 0 5cqw rgba(255,45,94,.5));
  animation:floaty 5s ease-in-out infinite;}
.fg .shapes{display:flex;gap:5cqw;align-items:center;margin-top:6cqh;}
.fg .bar{width:26cqw;height:10cqw;border-radius:3cqw;background:#d31242;box-shadow:0 0 6cqw rgba(255,45,94,.6);}
.fg .ring{width:16cqw;height:16cqw;border-radius:50%;border:2.4cqw solid #ffc24b;box-shadow:0 0 6cqw rgba(255,194,75,.55);}
.fg .dot{width:9cqw;height:9cqw;border-radius:50%;background:#fff;}
.fg .q{margin-top:7cqh;font-size:3.6cqw;color:rgba(255,255,255,.85);max-width:70cqw;line-height:1.4;}
.fg .q b{color:#ffc24b;}

/* ---- HUD: option label + controls (this is UI chrome, not the test bg) ---- */
.hud{position:absolute;z-index:2;left:0;right:0;top:0;padding:4cqh 5cqw 3cqh;
  display:flex;flex-direction:column;align-items:center;gap:1cqh;
  background:linear-gradient(#000,rgba(0,0,0,0));}
.hud .opt-num{font-family:'Archivo',sans-serif;font-weight:900;font-size:8cqw;line-height:1;}
.hud .opt-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:4.4cqw;color:#ffc24b;text-align:center;}
.hud .opt-css{font-family:ui-monospace,monospace;font-size:3.1cqw;color:rgba(255,255,255,.7);margin-top:.4cqh;
  background:rgba(255,255,255,.08);padding:.6cqh 2.4cqw;border-radius:100px;}

.tray{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:3cqh 4cqw 5cqh;
  display:flex;flex-direction:column;gap:2.4cqh;background:linear-gradient(rgba(0,0,0,0),#000 40%);}
.nums{display:flex;gap:2.2cqw;justify-content:center;flex-wrap:wrap;}
.nums button{width:12cqw;height:12cqw;border-radius:50%;border:.5cqw solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.06);color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:5cqw;cursor:pointer;
  transition:transform .12s ease,background .12s ease,border-color .12s ease;}
.nums button:active{transform:scale(.9);}
.nums button.active{background:#d31242;border-color:#ff2d5e;box-shadow:0 0 5cqw rgba(255,45,94,.7);}
.arrows{display:flex;gap:3cqw;}
.arrows button{flex:1;border:none;border-radius:100px;background:rgba(255,255,255,.1);color:#fff;
  font-family:'Archivo',sans-serif;font-weight:800;font-size:4.4cqw;padding:2.2cqh 0;cursor:pointer;}
.arrows button:active{background:rgba(255,255,255,.2);}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div id="bg"></div>

  <div class="fg">
    <svg class="bj-mark" viewBox="0 0 58 51" role="img" aria-label="BJ's">
      <path d="M10.4462 37.5187H7.75975V29.8315H10.3463C12.9844 29.8315 13.5803 31.9631 13.5803 33.6993C13.5803 35.8309 12.6334 37.5187 10.4462 37.5187ZM7.75975 16.6882H10.4462C12.4852 16.6882 13.4291 18.1737 13.4291 19.9612C13.4291 21.7486 12.6334 23.2372 10.546 23.2372H7.75975V16.6912V16.6882ZM16.663 26.012C19.9969 24.774 21.3885 21.498 21.3885 18.373C21.3885 12.0233 17.2106 9.8916 12.3854 9.8916H0V44.4633H11.986C18.9017 44.4633 22.4322 40.0973 22.4322 33.7989C22.4322 29.6322 19.5975 26.9057 16.663 26.012Z" fill="#D31242"/>
      <path d="M26.1866 35.3414C26.1866 39.5142 24.6709 42.8355 21.691 44.635L26.5314 50.9998L28.4706 49.3724C31.4323 46.7003 33.8223 41.987 33.8223 37.0292V9.90332H26.1049L26.1866 35.3414Z" fill="#D31242"/>
      <path d="M39.1104 21.3953C39.1104 21.3953 42.6348 15.9483 47.9502 10.0787C49.3448 8.54186 50.7788 7.04727 52.1159 5.6946C55.353 2.41558 58 -0.00292969 58 -0.00292969C58 -0.00292969 53.4289 2.55447 49.1784 5.68856C49.012 5.80934 48.8487 5.93011 48.6883 6.05089C43.7995 9.72545 40.5262 12.9531 40.5262 12.9531L36.8052 9.15479L39.1044 21.2564L39.1104 21.3923V21.3953Z" fill="#D31242"/>
      <path d="M45.7024 28.8169C45.6994 27.7903 46.8187 27.3676 48.0621 27.425C49.72 27.5005 51.0904 28.4123 52.7512 29.2638L55.002 23.9376C52.6817 22.7057 50.5943 21.7305 47.0396 21.7305C41.9209 21.7305 38.6476 25.0004 38.6476 29.5083C38.6476 36.9058 48.5764 34.2367 48.5764 37.9746C48.5764 38.7808 47.7203 39.4088 46.489 39.4088C44.453 39.4088 41.6879 37.884 40.0271 36.8001L37.5585 42.4312C40.499 44.1764 43.4849 45.0671 46.374 45.0671C52.0131 45.0671 55.8582 42.0055 55.8582 37.247C55.8582 29.4661 45.7297 32.2741 45.7055 28.8169" fill="#D31242"/>
      <path d="M54.0127 18.2067C54.0127 19.0552 53.3683 19.7375 52.5636 19.7315C51.7619 19.7315 51.1085 19.0582 51.1085 18.2007C51.1085 17.3432 51.7619 16.6759 52.5545 16.6759H52.5636C53.3683 16.6759 54.0097 17.3583 54.0127 18.2097M52.5575 16.3951C51.5683 16.3951 50.7666 17.1983 50.7666 18.2007C50.7666 19.2031 51.5683 20.0153 52.5575 20.0153C53.5468 20.0153 54.3455 19.2182 54.3455 18.2007C54.3455 17.1832 53.5559 16.3951 52.5666 16.3921H52.5575V16.3951Z" fill="#D31242"/>
      <path d="M52.9418 17.7899C52.9418 18.0375 52.7179 18.1341 52.4517 18.1341H52.2187V17.4517C52.2732 17.4457 52.3488 17.4336 52.4517 17.4366C52.8147 17.4366 52.9418 17.6148 52.9418 17.7899ZM51.8981 17.2343V19.2483H52.2187V18.3817H52.4426C52.7028 18.3817 52.8298 18.4783 52.8752 18.735C52.9176 19.0007 52.963 19.1849 53.0144 19.2483H53.3532C53.3199 19.1849 53.2715 19.0641 53.2231 18.7501C53.1838 18.4542 53.0628 18.2941 52.8873 18.2609V18.2458C53.1051 18.1824 53.2806 18.0224 53.2806 17.7567C53.2806 17.5635 53.2171 17.4276 53.093 17.34C52.9751 17.2494 52.7724 17.186 52.4698 17.186C52.2308 17.186 52.0675 17.2102 51.8981 17.2343Z" fill="#D31242"/>
    </svg>
    <div class="shapes"><div class="bar"></div><div class="ring"></div><div class="dot"></div></div>
    <div class="q">Does the area <b>around</b> these shapes disappear on the Proto?<br>If yes, this option is the one.</div>
  </div>

  <div class="hud">
    <div class="opt-num" id="opt-num">1</div>
    <div class="opt-name" id="opt-name"></div>
    <div class="opt-css" id="opt-css"></div>
  </div>

  <div class="tray">
    <div class="nums" id="nums"></div>
    <div class="arrows">
      <button onclick="step(-1)">‹ PREV</button>
      <button onclick="step(1)">NEXT ›</button>
    </div>
  </div>
</div>

<script>
/* Each option changes ONLY the background. `bg` is applied to <html>, <body>
   and #bg so whichever surface the Proto player samples is covered. */
const OPTIONS = [
  { name:"Transparent (alpha 0)",      css:"background: transparent",        bg:"transparent" },
  { name:"Pure Black (control)",       css:"background: #000000",            bg:"#000000" },
  { name:"Chroma Key — Green",         css:"background: #00FF00",            bg:"#00FF00" },
  { name:"Chroma Key — Magenta",       css:"background: #FF00FF",            bg:"#FF00FF" },
  { name:"Chroma Key — Blue",          css:"background: #0000FF",            bg:"#0000FF" },
  { name:"Chroma Key — Cyan",          css:"background: #00FFFF",            bg:"#00FFFF" }
];

let idx = 0;
const numsEl = document.getElementById('nums');
const bgEl   = document.getElementById('bg');

OPTIONS.forEach((o,i)=>{
  const b=document.createElement('button');
  b.textContent=i+1;
  b.onclick=()=>setOption(i);
  numsEl.appendChild(b);
});

function setOption(i){
  idx=(i+OPTIONS.length)%OPTIONS.length;
  const o=OPTIONS[idx];
  // apply the background under test to every candidate surface
  document.documentElement.style.background=o.bg;
  document.body.style.background=o.bg;
  bgEl.style.background=o.bg;
  // update HUD
  document.getElementById('opt-num').textContent=idx+1;
  document.getElementById('opt-name').textContent=o.name;
  document.getElementById('opt-css').textContent=o.css;
  [...numsEl.children].forEach((b,n)=>b.classList.toggle('active',n===idx));
}
function step(d){ setOption(idx+d); }

// keyboard / remote support: number keys + arrows
addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<=String(OPTIONS.length)) setOption(+e.key-1);
  else if(e.key==='ArrowRight') step(1);
  else if(e.key==='ArrowLeft') step(-1);
});

setOption(0);
</script>
</body>
</html>
