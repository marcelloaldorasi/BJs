<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BJ's Wholesale · Proto Hologram</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   BJ's WHOLESALE — Proto Hologram Promo Browser
   Target device: Proto M / M2 · 1080 x 1920 (9:16 portrait)

   HOLOGRAM RULE: on an additive holographic display, only PURE #000000
   renders as transparent (invisible). Any non-black fill — near-black
   greys, frosted panels, big glows — emits light and shows as a solid
   floating block. So every surface here is pure #000; only real content
   (product photos, text, logo, thin accent glows) carries light and
   appears to float. Product photos come on white studio backgrounds, so
   each is radially masked to fade its boxy edges into the void.
   ===================================================================== */

:root{
  --ink:#000000;
  --muted:rgba(0,0,0,.66);
  --faint:rgba(0,0,0,.34);
  --bj-red:#e15b41;          /* lighter cayenne (app accent) */
  --bj-red-bright:#ff7e60;   /* lighter cayenne highlight */
  --gold:#ffc24b;            /* price + savings accent */
  --line:rgba(0,0,0,.16);
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:transparent;}   /* fully transparent (test Option 1) */
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}

/* Device frame: locks content to Proto's 9:16 portrait */
.proto-frame{
  position:relative; aspect-ratio:9 / 16;
  height:min(100vh,calc(100vw * 16 / 9)); width:auto;
  background:transparent; overflow:hidden; container-type:size;
}

/* one screen visible at a time */
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; transform:translateY(1.2cqh);
  transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
}
.screen.active{opacity:1; visibility:visible; transform:none;
  transition:opacity .45s ease, transform .45s ease;}

/* ===== LOGO (official monogram, reused via <use>) ===== */
.logo{display:inline-flex; flex-direction:column; align-items:center; line-height:.9;}
.bj-mark{display:block; width:100%; height:auto; aspect-ratio:58 / 51;}
.logo .sub{margin-top:.5em; font-family:'Archivo',sans-serif; font-weight:700;
  letter-spacing:.42em; text-indent:.42em; color:var(--muted);}

/* ===== ATTRACT / LANDING ===== */
#attract{align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:8cqw;}
#attract .bj-mark{width:34cqw;}
#attract .logo .sub{font-size:3.3cqw;}
#attract .hero-float{animation:floaty 5.5s ease-in-out infinite;}
#attract .tagline{margin-top:7cqh; font-family:'Archivo',sans-serif; font-weight:800;
  font-size:9cqw; letter-spacing:-.01em;}
#attract .tagline em{color:var(--gold); font-style:normal;}
#attract .sub-tag{margin-top:1.6cqh; color:var(--muted); font-size:4cqw; max-width:72cqw;}
#attract .tap{position:absolute; bottom:9cqh; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:2cqh;
  color:var(--faint); font-size:3.6cqw; letter-spacing:.06em; animation:pulse 2.6s ease-in-out infinite;}
.tap .ring{width:11cqw; height:11cqw; border-radius:50%; border:.5cqw solid rgba(0,0,0,.4);
  display:grid; place-items:center;}
.tap .ring::after{content:""; width:3.4cqw; height:3.4cqw; border-radius:50%; background:var(--ink); opacity:.8;}

/* ===== APP HEADER ===== */
.app-head{flex:0 0 auto; display:flex; align-items:center; gap:3cqw; padding:5cqh 5cqw 2cqh;}
.app-head .logo{flex-direction:row; align-items:center;}
.app-head .bj-mark{width:11cqw;}
.app-head .logo .sub{display:none;}
.back{width:9.5cqw; height:9.5cqw; flex:0 0 auto; border-radius:50%;
  border:.4cqw solid var(--line); background:transparent; color:#000; display:grid; place-items:center;
  font-size:5cqw; cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.back:active{transform:scale(.9); border-color:var(--bj-red-bright);}
.head-titles{flex:1 1 auto; min-width:0;}
.head-eyebrow{font-size:3cqw; letter-spacing:.28em; color:var(--bj-red-bright); font-weight:700;}
.head-title{font-family:'Archivo',sans-serif; font-weight:800; font-size:6.6cqw; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ===== SCROLL AREA ===== */
.scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:1cqh 5cqw 8cqh; scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

/* ===== PROMO HOME ===== */
.home-lead{padding:1cqh 0 3cqh;}
.home-lead h1{font-family:'Archivo',sans-serif; font-weight:900; font-size:11cqw; line-height:.98; letter-spacing:-.02em;}
.home-lead h1 em{color:var(--gold); font-style:normal;}
.home-lead p{margin-top:1.4cqh; color:var(--muted); font-size:3.9cqw; max-width:78cqw;}

.promo-row{position:relative; display:flex; align-items:flex-start; gap:3.5cqw;
  width:100%; text-align:left; cursor:pointer; background:transparent; border:none;
  padding:3.4cqh 0; border-top:.35cqw solid var(--line);
  transition:opacity .15s ease;}
.promo-row:active{opacity:.6;}
.promo-row .emoji{font-size:9cqw; line-height:1; flex:0 0 auto;}
.promo-row .body{flex:1 1 auto; min-width:0;}
.promo-row h2{font-family:'Archivo',sans-serif; font-weight:800; font-size:6cqw; letter-spacing:-.01em;}
.promo-row .blurb{color:var(--muted); font-size:3.6cqw; margin-top:.7cqh; line-height:1.34;}
.promo-row .meta{display:flex; align-items:center; gap:2.4cqw; margin-top:1.9cqh; flex-wrap:wrap;}
.chip{font-size:3cqw; font-weight:700; padding:1cqh 2.6cqw; border-radius:100px;}
.chip.save{background:var(--gold); color:#1a1200;}
.chip.count{color:#000; border:.35cqw solid var(--line);}
.promo-row .chev{align-self:center; color:var(--bj-red-bright); font-size:6cqw; flex:0 0 auto;}

/* ===== PROMO DETAIL (product grid) ===== */
.detail-lead{color:var(--muted); font-size:3.9cqw; line-height:1.4; padding:.5cqh 0 3cqh; max-width:82cqw;}
.detail-lead strong{color:var(--gold); font-weight:700;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:5cqw 4cqw;}

.prod{position:relative; text-align:left; cursor:pointer; background:transparent; border:none; padding:0;
  transition:transform .16s ease;}
.prod:active{transform:scale(.97);}

/* hologram stage — pure black, product floats with soft red glow + masked edges */
.stage{position:relative; aspect-ratio:1; display:grid; place-items:center; background:transparent; overflow:hidden;}
.stage .glowpad{display:none;}
.stage .pimg{position:relative; width:94%; height:94%; object-fit:contain;
  -webkit-mask-image:radial-gradient(circle at 50% 47%, #000 58%, rgba(0,0,0,0) 82%);
          mask-image:radial-gradient(circle at 50% 47%, #000 58%, rgba(0,0,0,0) 82%);
  animation:floaty 6s ease-in-out infinite;}
.stage .tag3d{position:absolute; top:1.5cqw; left:1.5cqw; z-index:2; font-size:2.5cqw; font-weight:800;
  letter-spacing:.12em; padding:.6cqh 1.8cqw; border-radius:100px;
  background:rgba(0,0,0,.06); border:.35cqw solid rgba(0,0,0,.25); color:#000;}
/* fallback puck if a product image fails to load */
.stage .puck{display:none; width:46%; height:46%; border-radius:14%;
  background:linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.02));
  border:.4cqw solid rgba(0,0,0,.14); place-items:center; color:#000;
  font-family:'Archivo',sans-serif; font-weight:900; font-size:7cqw;
  box-shadow:0 6cqw 10cqw rgba(0,0,0,.6), inset 0 0 6cqw rgba(255,45,94,.25); animation:floaty 6s ease-in-out infinite;}

.prod .name{font-size:4cqw; font-weight:600; line-height:1.22; margin-top:1.2cqh; min-height:9.8cqw;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.prod .price-row{display:flex; align-items:baseline; gap:2cqw; margin-top:1cqh; flex-wrap:wrap;}
.prod .price{font-family:'Archivo',sans-serif; font-weight:900; font-size:6cqw; color:var(--gold);}
.prod .save{font-size:2.9cqw; font-weight:700; color:#000; background:var(--bj-red); padding:.5cqh 1.8cqw; border-radius:100px;}
.prod .flag{margin-top:1.2cqh; font-size:2.8cqw; font-weight:700; letter-spacing:.03em; color:var(--bj-red-bright);}
.prod.coupon .off{margin-top:1cqh; font-family:'Archivo',sans-serif; font-weight:900; font-size:5.4cqw; color:var(--gold);}
.prod.coupon .clip{display:inline-block; margin-top:1cqh; font-size:2.9cqw; font-weight:800; letter-spacing:.08em;
  color:var(--bj-red-bright); border:.35cqw solid var(--bj-red); border-radius:100px; padding:.7cqh 2.6cqw;}

/* ===== PRODUCT SHEET (3D hook) ===== */
#sheet{position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.62); backdrop-filter:blur(6px);
  display:flex; flex-direction:column; justify-content:flex-end;
  opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s;}
#sheet.open{opacity:1; visibility:visible; transition:opacity .3s ease;}
.sheet-body{background:transparent; border-top:.5cqw solid rgba(255,126,96,.5); border-radius:7cqw 7cqw 0 0;
  padding:3cqh 6cqw 5cqh; transform:translateY(4cqh); transition:transform .3s ease; max-height:90%;
  display:flex; flex-direction:column;}
#sheet.open .sheet-body{transform:none;}
.sheet-grab{width:16cqw; height:1.2cqh; border-radius:100px; background:rgba(0,0,0,.25); margin:0 auto 2.5cqh;}

/* Big hologram stage — swap .model-stage contents for <model-viewer>/three.js when GLBs exist */
.sheet-stage{position:relative; aspect-ratio:1; width:100%; overflow:hidden; margin-bottom:2.5cqh;
  display:grid; place-items:center; background:transparent;}
.sheet-stage .glowpad{display:none;}
.sheet-stage .pimg{position:relative; width:82%; height:82%; object-fit:contain;
  -webkit-mask-image:radial-gradient(circle at 50% 47%, #000 60%, rgba(0,0,0,0) 84%);
          mask-image:radial-gradient(circle at 50% 47%, #000 60%, rgba(0,0,0,0) 84%);
  animation:floaty 6.5s ease-in-out infinite;}
.sheet-stage .stage-note{position:absolute; bottom:1.5cqw; left:0; right:0; text-align:center;
  font-size:2.8cqw; letter-spacing:.1em; color:var(--faint);}
.sheet h3{font-family:'Archivo',sans-serif; font-weight:800; font-size:6cqw; line-height:1.15;}
.sheet .sheet-price{display:flex; align-items:baseline; gap:3cqw; margin-top:1.6cqh; flex-wrap:wrap;}
.sheet .sheet-price .p{font-family:'Archivo',sans-serif; font-weight:900; font-size:10cqw; color:var(--gold);}
.sheet .sheet-price .s{font-size:3.4cqw; font-weight:700; background:var(--bj-red); padding:.8cqh 3cqw; border-radius:100px;}
.sheet .sheet-flag{margin-top:1.4cqh; color:var(--bj-red-bright); font-weight:700; font-size:3.4cqw;}
.sheet .cta{margin-top:auto; padding-top:3cqh;}
.sheet .cta button{width:100%; border:none; cursor:pointer; background:var(--bj-red); color:#000;
  font-family:'Archivo',sans-serif; font-weight:800; font-size:5cqw; letter-spacing:.02em;
  padding:2.4cqh 0; border-radius:100px; transition:transform .15s ease;}
.sheet .cta button:active{transform:scale(.97);}
.sheet .cta .hint{text-align:center; color:var(--faint); font-size:3cqw; margin-top:1.4cqh;}

/* ===== ANIMATIONS ===== */
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5%)}}
@keyframes pulse{0%,100%{opacity:.5} 50%{opacity:1}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div class="proto-frame" id="app">

  </svg>

  <!-- ============== ATTRACT / LANDING ============== -->
  <section class="screen active" id="attract" onclick="go('home')">
    <div class="hero-float">
      <div class="logo">
        <svg class="bj-mark" role="img" aria-label="BJ's Wholesale Club"><use href="#bjs-mark"></use></svg>
        <span class="sub">WHOLESALE CLUB</span>
      </div>
    </div>
    <div class="tagline">Today's <em>Deals</em></div>
    <div class="sub-tag">Member savings, in 3D. Browse this week's featured offers.</div>

  </section>

  <!-- ============== PROMO HOME ============== -->
  <section class="screen" id="home">
    <div class="app-head">

  </section>

  <!-- ============== PROMO DETAIL ============== -->
  <section class="screen" id="detail">
    <div class="app-head">
      <button class="back" onclick="go('home')" aria-label="Back">&#8592;</button>
      <div class="head-titles"><div class="head-eyebrow">BJ'S DEALS</div><div class="head-title" id="detail-title">Promo</div></div>

           <model-viewer src="models/{item}.glb" camera-controls auto-rotate ar
             style="width:100%;height:100%"></model-viewer>

/* ===== RENDER + ROUTER ===== */
const $ = s => document.querySelector(s);
const ERR = "this.style.display='none';this.parentNode.querySelector('.puck').style.display='grid';";

function go(screen){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#'+screen).classList.add('active');
  document.querySelectorAll('.scroll').forEach(el => el.scrollTop = 0);
}
function initials(str){
  const c = str.replace(/[^A-Za-z ]/g,'').trim();
  return c ? c.split(' ')[0].slice(0,2).toUpperCase() : 'BJ';
}

function renderHome(){
  $('#promo-list').innerHTML = PROMOS.map(p => `
    <button class="promo-row" onclick="openPromo('${p.id}')">
      <span class="emoji">${p.emoji}</span>
      <span class="body">
        <h2>${p.title}</h2>
        <span class="blurb">${p.blurb}</span>
        <span class="meta"><span class="chip save">${p.save}</span><span class="chip count">${p.count}</span></span>
      </span>
      <span class="chev">&#8250;</span>
    </button>`).join('');
}

function openPromo(id){
  const p = PROMOS.find(x => x.id === id);
  $('#detail-title').textContent = p.title;
  $('#detail-lead').innerHTML = p.lead;
  $('#product-grid').innerHTML = p.products.map((prod,i) => {
    const stage = `
      <div class="stage">
        ${p.coupon ? '<span class="tag3d">CLIP</span>' : ''}
        <div class="glowpad"></div>
        <img class="pimg" src="${IMG(prod.item,'400')}" alt="${prod.name}" loading="lazy" onerror="${ERR}">
        <div class="puck">${initials(prod.name)}</div>
      </div>`;
    if(p.coupon){
      return `<button class="prod coupon" onclick="openSheet('${id}',${i})">
        ${stage}
        <div class="name">${prod.name}</div>
        <div class="off">${prod.off}</div>
        <span class="clip">CLIP TO CARD</span>
      </button>`;
    }
    return `<button class="prod" onclick="openSheet('${id}',${i})">
      ${stage}
      <div class="name">${prod.name}</div>
      <div class="price-row"><span class="price">${prod.price}</span>${prod.save?`<span class="save">${prod.save}</span>`:''}</div>
      ${prod.flag?`<div class="flag">${prod.flag}</div>`:''}
    </button>`;
  }).join('');
  go('detail');
}

function openSheet(id,i){
  const p = PROMOS.find(x => x.id === id);
  const prod = p.products[i];
  const img = $('#sheet-img');
  img.src = IMG(prod.item,'Zoom');
  img.onerror = function(){ this.style.visibility='hidden'; };
  $('#sheet-name').textContent = prod.name;

  const saveEl = $('#sheet-save');
  if(p.coupon){
    $('#sheet-price').textContent = prod.off;
    saveEl.style.display='none';
    $('#sheet-flag').textContent = 'Clip to your card — applies automatically at checkout.';
    $('#sheet-btn').textContent = 'Clip to Card';
  } else {
    $('#sheet-price').textContent = prod.price;
    if(prod.save){ saveEl.style.display=''; saveEl.textContent = prod.save; } else { saveEl.style.display='none'; }
    $('#sheet-flag').textContent = prod.flag || '';
    $('#sheet-btn').textContent = 'Add to Cart';
  }
  /* When a real model exists: if(prod.model){ mountModelViewer(prod.model); } */
  $('#sheet').classList.add('open');
}
function closeSheet(){ $('#sheet').classList.remove('open'); }

renderHome();
</script>
