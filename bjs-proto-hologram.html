<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BJ's Wholesale · Proto Hologram</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   BJ's WHOLESALE — Proto Hologram Promo Browser
   Target device: Proto M / M2  ·  1080 x 1920 (9:16 portrait)
   Canvas is pure black so lit content "floats" in the holographic volume.
   All sizing is in container units (cqw / cqh) so the layout is resolution
   independent: it fills a real 1080x1920 device and previews as a tall
   device frame anywhere else.
   ===================================================================== */

:root{
  --black:#000000;
  --ink:#ffffff;
  --muted:rgba(255,255,255,.62);
  --faint:rgba(255,255,255,.30);

  --bj-red:#d31242;          /* BJ's brand red (matches official logo) */
  --bj-red-bright:#ff2d5e;   /* holographic bloom / edge glow */
  --gold:#ffc24b;            /* price + savings accent */

  --card:rgba(255,255,255,.045);
  --card-line:rgba(255,255,255,.10);
  --card-line-hot:rgba(255,46,77,.55);
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:#060606;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* ---- Device frame: locks content to Proto's 9:16 portrait ---- */
.proto-frame{
  position:relative;
  aspect-ratio:9 / 16;
  height:min(100vh,calc(100vw * 16 / 9));
  width:auto;
  background:var(--black);
  overflow:hidden;
  container-type:size;
  box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 40px 120px rgba(255,46,77,.10);
}

/* one screen visible at a time */
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden;
  transform:translateY(1.2cqh);
  transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
}
.screen.active{
  opacity:1; visibility:visible; transform:none;
  transition:opacity .45s ease, transform .45s ease;
}

/* shared holographic bloom behind hero content */
.bloom{
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  width:120cqw; height:60cqh; pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,46,77,.28), rgba(228,0,43,.08) 55%, transparent 72%);
  filter:blur(2px);
}

/* =========================== LOGO =========================== */
/* Placeholder wordmark recreated in CSS. Swap for the official
   BJ's brand asset (SVG/PNG) when you have rights to embed it. */
.logo{display:inline-flex; flex-direction:column; align-items:center; line-height:.9;}
/* Official BJ's monogram, inlined as SVG (single-file, no external asset) */
.bj-mark{display:block; width:100%; height:auto; aspect-ratio:58 / 51;}
.logo .sub{
  margin-top:.5em; font-family:'Archivo',sans-serif; font-weight:700;
  letter-spacing:.42em; text-indent:.42em; color:var(--muted);
}

/* =========================== ATTRACT / LANDING =========================== */
#attract{align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:8cqw;}
#attract .bj-mark{width:36cqw; filter:drop-shadow(0 0 5cqw rgba(211,18,66,.60));}
#attract .logo .sub{font-size:3.3cqw;}
#attract .hero-float{animation:floaty 5.5s ease-in-out infinite;}
#attract .tagline{
  margin-top:7cqh; font-family:'Archivo',sans-serif; font-weight:800;
  font-size:9cqw; letter-spacing:-.01em;
  text-shadow:0 0 6cqw rgba(255,46,77,.35);
}
#attract .tagline em{color:var(--gold); font-style:normal;}
#attract .sub-tag{margin-top:1.6cqh; color:var(--muted); font-size:4cqw; max-width:70cqw;}
#attract .tap{
  position:absolute; bottom:9cqh; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:2cqh;
  color:var(--faint); font-size:3.6cqw; letter-spacing:.06em;
  animation:pulse 2.6s ease-in-out infinite;
}
.tap .ring{
  width:11cqw; height:11cqw; border-radius:50%;
  border:.5cqw solid rgba(255,255,255,.35);
  display:grid; place-items:center;
}
.tap .ring::after{content:""; width:3.4cqw; height:3.4cqw; border-radius:50%; background:var(--ink); opacity:.8;}

/* =========================== APP HEADER =========================== */
.app-head{
  flex:0 0 auto; display:flex; align-items:center; gap:3cqw;
  padding:5cqh 5cqw 2cqh;
}
.app-head .logo{flex-direction:row; align-items:center;}
.app-head .bj-mark{width:11cqw; filter:drop-shadow(0 0 2.5cqw rgba(211,18,66,.5));}
.app-head .logo .sub{display:none;}
.back{
  width:9.5cqw; height:9.5cqw; flex:0 0 auto;
  border-radius:50%; border:.4cqw solid var(--card-line);
  background:var(--card); color:#fff;
  display:grid; place-items:center; font-size:5cqw; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
}
.back:active{transform:scale(.9); border-color:var(--bj-red-bright);}
.head-titles{flex:1 1 auto; min-width:0;}
.head-eyebrow{font-size:3cqw; letter-spacing:.28em; color:var(--bj-red-bright); font-weight:700;}
.head-title{font-family:'Archivo',sans-serif; font-weight:800; font-size:6.6cqw; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* =========================== PROMO HOME =========================== */
.scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:1cqh 5cqw 6cqh; scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

.home-lead{padding:1cqh 0 3cqh;}
.home-lead h1{font-family:'Archivo',sans-serif; font-weight:900; font-size:11cqw; line-height:.98; letter-spacing:-.02em;}
.home-lead h1 em{color:var(--gold); font-style:normal;}
.home-lead p{margin-top:1.4cqh; color:var(--muted); font-size:3.9cqw; max-width:78cqw;}

.promo-card{
  position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  border:.4cqw solid var(--card-line); border-radius:4.5cqw;
  background:
     linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
     var(--black);
  padding:5cqw; margin-bottom:3.4cqh; overflow:hidden;
  transition:transform .18s ease, border-color .18s ease;
}
.promo-card:active{transform:scale(.985);}
.promo-card.hot{border-color:var(--card-line-hot); box-shadow:0 0 9cqw rgba(255,46,77,.16);}
.promo-card .glow{
  position:absolute; right:-14cqw; top:-14cqw; width:44cqw; height:44cqw; border-radius:50%;
  background:radial-gradient(closest-side, var(--pc,rgba(255,46,77,.4)), transparent 72%);
  pointer-events:none;
}
.promo-card .emoji{font-size:8.5cqw; line-height:1;}
.promo-card h2{font-family:'Archivo',sans-serif; font-weight:800; font-size:6.4cqw; margin-top:1.4cqh; letter-spacing:-.01em;}
.promo-card .blurb{color:var(--muted); font-size:3.7cqw; margin-top:.8cqh; line-height:1.35; max-width:80cqw;}
.promo-card .meta{
  display:flex; align-items:center; gap:2.5cqw; margin-top:2.6cqh;
}
.chip{
  font-size:3cqw; font-weight:700; letter-spacing:.02em;
  padding:1.1cqh 2.6cqw; border-radius:100px;
}
.chip.count{background:rgba(255,255,255,.08); color:#fff;}
.chip.save{background:var(--gold); color:#1a1200;}
.promo-card .go{
  position:absolute; right:5cqw; bottom:5cqw; width:9cqw; height:9cqw; border-radius:50%;
  background:var(--bj-red); display:grid; place-items:center; font-size:4.4cqw;
  box-shadow:0 0 5cqw rgba(255,46,77,.6);
}

/* =========================== PROMO DETAIL (product grid) =========================== */
.detail-lead{color:var(--muted); font-size:3.9cqw; line-height:1.4; padding:.5cqh 0 3cqh; max-width:82cqw;}
.detail-lead strong{color:var(--gold); font-weight:700;}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:3.2cqw;}
.prod{
  position:relative; text-align:left; cursor:pointer;
  border:.4cqw solid var(--card-line); border-radius:3.6cqw;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012));
  padding:3.4cqw; overflow:hidden;
  transition:transform .16s ease, border-color .16s ease;
}
.prod:active{transform:scale(.97); border-color:var(--bj-red-bright);}
/* the "hologram stage" where a 3D product model will live later */
.stage{
  position:relative; aspect-ratio:1; border-radius:2.6cqw; overflow:hidden;
  background:radial-gradient(120% 90% at 50% 20%, rgba(255,46,77,.20), rgba(0,0,0,0) 60%), #000;
  display:grid; place-items:center;
}
.stage .puck{
  width:48%; height:48%; border-radius:14%;
  background:linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.02));
  border:.4cqw solid rgba(255,255,255,.14);
  display:grid; place-items:center; color:#fff; font-family:'Archivo',sans-serif; font-weight:900; font-size:6.5cqw;
  box-shadow:0 6cqw 10cqw rgba(0,0,0,.6), inset 0 0 6cqw rgba(255,46,77,.25);
  animation:floaty 6s ease-in-out infinite;
}
.stage .reflect{
  position:absolute; bottom:8%; width:52%; height:6%; border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,46,77,.5), transparent 70%);
  filter:blur(1px);
}
.stage .tag3d{
  position:absolute; top:2.4cqw; left:2.4cqw;
  font-size:2.5cqw; font-weight:800; letter-spacing:.12em;
  padding:.7cqh 2cqw; border-radius:100px;
  background:rgba(0,0,0,.55); border:.35cqw solid rgba(255,255,255,.22); color:var(--muted);
}
.prod .name{font-size:3.5cqw; font-weight:600; line-height:1.28; margin-top:2.4cqw; min-height:8.8cqw;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.prod .price-row{display:flex; align-items:baseline; gap:2cqw; margin-top:1.4cqw; flex-wrap:wrap;}
.prod .price{font-family:'Archivo',sans-serif; font-weight:900; font-size:6cqw; color:var(--gold);}
.prod .save{font-size:2.9cqw; font-weight:700; color:#fff; background:var(--bj-red); padding:.5cqh 1.8cqw; border-radius:100px;}
.prod .flag{margin-top:1.6cqw; font-size:2.8cqw; font-weight:700; letter-spacing:.04em; color:var(--bj-red-bright);}

/* coupon variant */
.prod.coupon .stage{background:radial-gradient(120% 90% at 50% 30%, rgba(255,194,75,.22), rgba(0,0,0,0) 60%), #000;}
.prod.coupon .puck{font-size:5cqw; border-radius:12%; animation:none;}
.prod.coupon .exp{margin-top:1.4cqw; font-size:2.9cqw; color:var(--muted);}

/* =========================== PRODUCT SHEET (3D hook) =========================== */
#sheet{
  position:absolute; inset:0; z-index:20;
  background:rgba(0,0,0,.55); backdrop-filter:blur(6px);
  display:flex; flex-direction:column; justify-content:flex-end;
  opacity:0; visibility:hidden; transition:opacity .3s ease, visibility 0s linear .3s;
}
#sheet.open{opacity:1; visibility:visible; transition:opacity .3s ease;}
.sheet-body{
  background:linear-gradient(180deg,#0b0b0b,#000);
  border-top:.5cqw solid var(--card-line-hot);
  border-radius:7cqw 7cqw 0 0;
  padding:3cqh 6cqw 5cqh;
  transform:translateY(4cqh); transition:transform .3s ease;
  max-height:88%;
  display:flex; flex-direction:column;
}
#sheet.open .sheet-body{transform:none;}
.sheet-grab{width:16cqw; height:1.2cqh; border-radius:100px; background:rgba(255,255,255,.22); margin:0 auto 2.5cqh;}

/* Big hologram stage — replace inner .model-stub with <model-viewer> / three.js canvas */
.sheet-stage{
  position:relative; aspect-ratio:1; width:100%; border-radius:5cqw; overflow:hidden;
  background:radial-gradient(120% 90% at 50% 18%, rgba(255,46,77,.24), rgba(0,0,0,0) 62%), #000;
  display:grid; place-items:center; margin-bottom:3cqh;
}
.sheet-stage .model-stub{
  width:46%; height:46%; border-radius:16%;
  background:linear-gradient(150deg, rgba(255,255,255,.18), rgba(255,255,255,.02));
  border:.4cqw solid rgba(255,255,255,.16);
  display:grid; place-items:center; color:#fff; font-family:'Archivo',sans-serif; font-weight:900; font-size:11cqw;
  box-shadow:0 8cqw 16cqw rgba(0,0,0,.6), inset 0 0 8cqw rgba(255,46,77,.3);
  animation:spin3d 9s linear infinite;
}
.sheet-stage .stage-note{
  position:absolute; bottom:3cqw; left:0; right:0; text-align:center;
  font-size:2.9cqw; letter-spacing:.1em; color:var(--faint);
}
.sheet h3{font-family:'Archivo',sans-serif; font-weight:800; font-size:6.2cqw; line-height:1.15;}
.sheet .sheet-price{display:flex; align-items:baseline; gap:3cqw; margin-top:2cqh;}
.sheet .sheet-price .p{font-family:'Archivo',sans-serif; font-weight:900; font-size:11cqw; color:var(--gold);}
.sheet .sheet-price .s{font-size:3.6cqw; font-weight:700; background:var(--bj-red); padding:.8cqh 3cqw; border-radius:100px;}
.sheet .sheet-flag{margin-top:1.6cqh; color:var(--bj-red-bright); font-weight:700; font-size:3.4cqw;}
.sheet .cta{
  margin-top:auto; padding-top:3cqh;
}
.sheet .cta button{
  width:100%; border:none; cursor:pointer;
  background:var(--bj-red); color:#fff;
  font-family:'Archivo',sans-serif; font-weight:800; font-size:5cqw; letter-spacing:.02em;
  padding:2.4cqh 0; border-radius:100px;
  box-shadow:0 0 8cqw rgba(255,46,77,.5);
  transition:transform .15s ease;
}
.sheet .cta button:active{transform:scale(.97);}
.sheet .cta .hint{text-align:center; color:var(--faint); font-size:3cqw; margin-top:1.6cqh;}

/* =========================== ANIMATIONS =========================== */
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6%)}}
@keyframes spin3d{0%{transform:rotateY(0) rotateX(8deg)} 100%{transform:rotateY(360deg) rotateX(8deg)}}
@keyframes pulse{0%,100%{opacity:.5} 50%{opacity:1}}
.sheet-stage .model-stub{transform-style:preserve-3d;}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;}
}
</style>
</head>

  </svg>

  <!-- ============== ATTRACT / LANDING ============== -->
  <section class="screen active" id="attract" onclick="go('home')">
    <div class="bloom"></div>
    <div class="hero-float">
      <div class="logo">
        <svg class="bj-mark" role="img" aria-label="BJ's Wholesale Club"><use href="#bjs-mark"></use></svg>
        <span class="sub">WHOLESALE CLUB</span>
      </div>
    </div>
    <div class="tagline">Today's <em>Deals</em></div>
    <div class="sub-tag">Member savings, in 3D. Browse this week's featured offers.</div>
    <div class="tap">
      <div class="ring"></div>
      <span>TAP TO EXPLORE</span>
    </div>
  </section>

  <!-- ============== PROMO HOME ============== -->
  <section class="screen" id="home">
    <div class="bloom" style="height:34cqh"></div>
    <div class="app-head">
      <div class="logo"><svg class="bj-mark" role="img" aria-label="BJ's Wholesale Club"><use href="#bjs-mark"></use></svg></div>
    </div>
    <div class="scroll">
      <div class="home-lead">
        <h1>This Week's<br><em>Savings</em></h1>
        <p>Tap any event to see the deals inside.</p>
      </div>
      <div id="promo-list"></div>
    </div>
  </section>

  <!-- ============== PROMO DETAIL ============== -->
  <section class="screen" id="detail">
    <div class="bloom" style="height:30cqh"></div>
    <div class="app-head">
      <button class="back" onclick="go('home')" aria-label="Back">&#8592;</button>
      <div class="head-titles">
        <div class="head-eyebrow">BJ'S DEALS</div>
        <div class="head-title" id="detail-title">Promo</div>
      </div>
    </div>
    <div class="scroll">
      <p class="detail-lead" id="detail-lead"></p>
      <div class="grid" id="product-grid"></div>
    </div>
  </section>

  <!-- ============== PRODUCT SHEET (future 3D lives here) ============== -->
  <div id="sheet" onclick="if(event.target.id==='sheet') closeSheet()">
    <div class="sheet-body">
      <div class="sheet-grab"></div>
      <!-- 3D HOOK:
           Replace .model-stub below with a real 3D viewer once assets exist, e.g.
           <model-viewer src="models/{sku}.glb" camera-controls auto-rotate ar
             style="width:100%;height:100%"></model-viewer>
           or a <canvas> driven by three.js. The product object already carries an
           optional `model` field to point at the asset. -->
      <div class="sheet-stage">
        <div class="model-stub" id="sheet-initial">BJ</div>
        <div class="stage-note" id="sheet-note">3D MODEL COMING SOON · DRAG TO ROTATE</div>
      </div>
      <h3 id="sheet-name">Product</h3>
      <div class="sheet-price">
        <span class="p" id="sheet-price">$0.00</span>
        <span class="s" id="sheet-save" style="display:none"></span>
      </div>
      <div class="sheet-flag" id="sheet-flag"></div>
      <div class="cta">

/* =====================================================================
   RENDER + ROUTER
   ===================================================================== */
const $ = s => document.querySelector(s);
let currentPromo = null;

function go(screen){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#'+screen).classList.add('active');
  $('.scroll') && document.querySelectorAll('.scroll').forEach(el => el.scrollTop = 0);
}

function initial(str){
  // a short glyph for the placeholder puck: brand mark or first letters
  const clean = str.replace(/[^A-Za-z ]/g,'').trim();
  return clean ? clean.split(' ')[0].slice(0,2).toUpperCase() : 'BJ';
}

function renderHome(){
  const list = $('#promo-list');
  list.innerHTML = PROMOS.map(p => `
    <button class="promo-card ${p.hot?'hot':''}" style="--pc:${p.accent}" onclick="openPromo('${p.id}')">
      <div class="glow"></div>
      <div class="emoji">${p.emoji}</div>
      <h2>${p.title}</h2>
      <div class="blurb">${p.blurb}</div>
      <div class="meta">
        <span class="chip save">${p.save}</span>
        <span class="chip count">${p.count}</span>
      </div>
      <div class="go">&#8594;</div>
    </button>
  `).join('');
}

function openPromo(id){
  const p = PROMOS.find(x => x.id === id);
  currentPromo = p;
  $('#detail-title').textContent = p.title;
  $('#detail-lead').innerHTML = p.lead;
  const grid = $('#product-grid');
  grid.innerHTML = p.products.map((prod,i) => {
    if(p.coupon){
      return `
      <button class="prod coupon" onclick="openSheet('${id}',${i})">
        <div class="stage">
          <span class="tag3d">CLIP</span>
          <div class="puck">${initial(prod.name)}</div>
          <div class="reflect"></div>
        </div>
        <div class="name">${prod.name}</div>
        <div class="price-row"><span class="price">${prod.price}</span></div>
        <div class="exp">${prod.exp||''}</div>
      </button>`;
    }
    return `
      <button class="prod" onclick="openSheet('${id}',${i})">
        <div class="stage">
          <span class="tag3d">3D</span>
          <div class="puck">${initial(prod.name)}</div>
          <div class="reflect"></div>
        </div>
        <div class="name">${prod.name}</div>
        <div class="price-row">
          <span class="price">${prod.price}</span>
          ${prod.save?`<span class="save">${prod.save}</span>`:''}
        </div>
        ${prod.flag?`<div class="flag">${prod.flag}</div>`:''}
      </button>`;
  }).join('');
  go('detail');
}

function openSheet(id,i){
  const p = PROMOS.find(x => x.id === id);
  const prod = p.products[i];
  $('#sheet-name').textContent = prod.name;
  $('#sheet-price').textContent = prod.price;
  $('#sheet-initial').textContent = initial(prod.name);

  const saveEl = $('#sheet-save');
  if(prod.save){ saveEl.style.display=''; saveEl.textContent = prod.save; }
  else { saveEl.style.display='none'; }

  const flagEl = $('#sheet-flag');
  flagEl.textContent = prod.flag || prod.exp || '';

  const btn = document.querySelector('#sheet .cta button');
  const note = $('#sheet-note');
  if(p.coupon){
    btn.textContent = 'Clip to Card';
    note.textContent = 'CLIPPED SAVINGS · APPLIES AT CHECKOUT';
  } else {
    btn.textContent = 'Add to Cart';
    note.textContent = prod.model ? 'DRAG TO ROTATE · PINCH TO ZOOM' : '3D MODEL COMING SOON · PLACEHOLDER';
  }

  /* When a real model exists, this is where you'd mount the 3D viewer:
     if(prod.model){ mountModelViewer(prod.model); } */

  $('#sheet').classList.add('open');
}
function closeSheet(){ $('#sheet').classList.remove('open'); }
